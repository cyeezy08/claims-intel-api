name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore (test project transitively restores API)
        run: dotnet restore tests/ClaimsIntel.Tests
      - name: Build
        run: dotnet build tests/ClaimsIntel.Tests --no-restore
      - name: Unit + integration tests
        run: dotnet test tests/ClaimsIntel.Tests --no-build --verbosity normal
